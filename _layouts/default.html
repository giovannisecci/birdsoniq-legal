<!DOCTYPE html>
<html lang="{{ page.lang | default: 'it' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: site.title }}</title>
{% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #202020;
    background: #fafaf8;
    line-height: 1.65;
  }
  .topbar {
    background: #fff;
    border-bottom: 1px solid #e5e3de;
    padding: 16px 0;
    margin-bottom: 32px;
  }
  .topbar-inner {
    max-width: 820px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .topbar a.home {
    text-decoration: none;
    color: #1a1a1a;
    font-weight: 600;
    font-size: 15px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .topbar a.home:hover { color: #2a7ed4; }
  .topbar .nav-links {
    display: flex;
    gap: 16px;
    font-size: 13px;
  }
  .topbar .nav-links a {
    color: #666;
    text-decoration: none;
  }
  .topbar .nav-links a:hover {
    color: #2a7ed4;
    text-decoration: underline;
  }
  .wrap {
    max-width: 820px;
    margin: 0 auto;
    padding: 0 24px 64px;
  }
  .content {
    background: #fff;
    border: 1px solid #e5e3de;
    border-radius: 12px;
    padding: 36px 44px;
  }
  .content h1 {
    font-size: 28px;
    font-weight: 600;
    margin: 0 0 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid #e5e3de;
    letter-spacing: -0.01em;
  }
  .content h2 {
    font-size: 21px;
    font-weight: 600;
    margin: 36px 0 12px;
    color: #1a1a1a;
  }
  .content h3 {
    font-size: 17px;
    font-weight: 600;
    margin: 24px 0 8px;
    color: #333;
  }
  .content p {
    margin: 0 0 14px;
    color: #333;
  }
  .content ul, .content ol {
    margin: 0 0 14px;
    padding-left: 24px;
  }
  .content li {
    margin-bottom: 6px;
    color: #333;
  }
  .content blockquote {
    border-left: 3px solid #2a7ed4;
    background: #f0f6fc;
    padding: 12px 18px;
    margin: 20px 0;
    color: #444;
    border-radius: 0 6px 6px 0;
    font-size: 14px;
  }
  .content blockquote p:last-child { margin-bottom: 0; }
  .content strong { color: #1a1a1a; font-weight: 600; }
  .content a {
    color: #2a7ed4;
    text-decoration: none;
    border-bottom: 1px dotted #9cc2eb;
  }
  .content a:hover {
    border-bottom-style: solid;
  }
  .content code {
    background: #f0efea;
    padding: 1px 6px;
    border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.88em;
    color: #333;
  }
  .content table {
    border-collapse: collapse;
    width: 100%;
    margin: 16px 0 24px;
    font-size: 14px;
  }
  .content th, .content td {
    border: 1px solid #e5e3de;
    padding: 8px 12px;
    text-align: left;
    vertical-align: top;
  }
  .content th {
    background: #f0efea;
    font-weight: 600;
  }
  .content hr {
    border: 0;
    border-top: 1px solid #e5e3de;
    margin: 32px 0;
  }
  .content em {
    color: #555;
  }
  footer {
    text-align: center;
    margin-top: 48px;
    color: #888;
    font-size: 13px;
  }
  footer a {
    color: #666;
    text-decoration: none;
    border-bottom: 1px dotted #aaa;
  }
  footer a:hover { color: #333; }
  @media (max-width: 640px) {
    .content { padding: 24px 20px; }
    .content h1 { font-size: 24px; }
    .content h2 { font-size: 18px; }
    .content table { font-size: 13px; display: block; overflow-x: auto; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="home" href="index.html">🦉 Birdsoniq Legal</a>
    <div class="nav-links">
      <a href="privacy_policy_it.html">Privacy IT</a>
      <a href="privacy_policy_en.html">Privacy EN</a>
      <a href="terms_of_service_it.html">Terms IT</a>
      <a href="terms_of_service_en.html">Terms EN</a>
    </div>
  </div>
</div>

<div class="wrap">
  <article class="content">
    {{ content }}
  </article>

  <footer>
    <p><a href="index.html">← Torna all'indice · Back to index</a></p>
  </footer>
</div>

</body>
</html>
